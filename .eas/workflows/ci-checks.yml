name: CI checks

# Runs on every PR targeting any of the three long-lived branches. This is
# the gate an agent's PR must pass before a human even looks at it.
on:
  pull_request:
    branches: ['dev', 'staging', 'main']

jobs:
  lint_typecheck_test:
    name: Lint, typecheck, unit tests
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --ci --coverage
