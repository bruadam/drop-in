<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<script src="674429fd-4cb4-4ae2-aedf-fc59d3638006"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 32px 16px 4px 16px; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 28px; line-height: 34px; font-weight: 700; color: #211D17;">Create a community</div>
    <div style="font-size: 13px; line-height: 18px; font-weight: 400; color: #5C5648;">Communities are created by invitation — codes come from the platform admin.</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px; overflow: hidden;">

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5648;">Creation code</span>
      <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #2F6F4E; background: #DCEEE2; border-radius: 14px; padding: 12px 16px;">
        <span style="flex-grow: 1; font-size: 15px; color: #211D17;">DROPIN-9F2K</span>
        <span style="color: #2F6F4E; font-size: 14px;">✓</span>
      </div>
    </label>

    <div style="height: 1px; background: #E1DACC;"></div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5648;">Community name</span>
      <input type="text" placeholder="e.g. Fælled Court" style="border: 1px solid #C7BEAC; background: #EFEAE1; border-radius: 14px; padding: 12px 16px; font-size: 15px; color: #211D17; box-sizing: border-box;">
    </label>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 56px; height: 56px; border-radius: 14px; background: #EFEAE1; border: 2px dashed #C7BEAC; flex-shrink: 0;"></div>
      <a href="#" style="font-size: 13px; line-height: 18px; color: {{accent}}; text-decoration: underline;">Upload logo</a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5648;">Accent color</span>
      <div style="display: flex; gap: 8px;">
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #B84F26; border: 2px solid #211D17;"></div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #1C6E8C;"></div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #2F6F4E;"></div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #8A5F0A;"></div>
      </div>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5648;">Zones / buildings</span>
      <input type="text" placeholder="e.g. Lunden, Kronen, Norden, Spidsen, Søen" style="border: 1px solid #C7BEAC; background: #EFEAE1; border-radius: 14px; padding: 12px 16px; font-size: 15px; color: #211D17; box-sizing: border-box;">
      <span style="font-size: 11px; line-height: 15px; color: #726B5B;">Comma-separated, edit anytime later</span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5648;">Location</span>
      <input type="text" placeholder="Search address" style="border: 1px solid #C7BEAC; background: #EFEAE1; border-radius: 14px; padding: 12px 16px; font-size: 15px; color: #211D17; box-sizing: border-box;">
      <span style="font-size: 11px; line-height: 15px; color: #726B5B;">Used for the ~20km nearby-communities list</span>
    </label>

  </div>

  <div style="padding: 16px; padding-bottom: 32px;">
    <button style="width: 100%; border: none; background: {{accent}}; color: #FFFFFF; font-size: 16px; line-height: 21px; font-weight: 600; padding: 14px; border-radius: 14px; box-sizing: border-box;">Create community</button>
  </div>

</div>
</x-dc>
<script data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B84F26&quot;,&quot;options&quot;:[&quot;#B84F26&quot;,&quot;#1C6E8C&quot;,&quot;#2F6F4E&quot;,&quot;#8A5F0A&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B84F26' };
  }
}
</script>


</body></html>
